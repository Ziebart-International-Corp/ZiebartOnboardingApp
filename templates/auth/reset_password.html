<!DOCTYPE html>
<html lang="en">
<head>
    <title>Reset password - Ziebart Onboarding</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --bg-panel: linear-gradient(155deg, #1a1f2b 0%, #0f141d 62%, #090d14 100%);
            --text-primary: #f4f7fc;
            --text-muted: #a7b0c0;
            --border-soft: rgba(255,255,255,0.2);
            --accent-red: #fe0100;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'URW Form', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0a0d12 0%, #111722 55%, #090d14 100%);
            color: var(--text-primary);
            padding: 22px;
        }
        .panel {
            width: 100%;
            max-width: 430px;
            padding: 36px 30px;
            border-radius: 16px;
            background: var(--bg-panel);
            border: 1px solid var(--border-soft);
            box-shadow: 0 20px 55px rgba(0,0,0,0.5);
        }
        h1 { font-size: 1.5em; margin-bottom: 8px; }
        .subtitle { color: var(--text-muted); margin-bottom: 22px; line-height: 1.5; }
        .flash { padding: 12px 14px; border-radius: 8px; margin-bottom: 16px; }
        .flash.error { background: rgba(200, 70, 70, 0.28); color: #ffecec; border: 1px solid rgba(255, 120, 120, 0.45); }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; }
        input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.24);
            background: rgba(255,255,255,0.08);
            color: var(--text-primary);
            font-size: 16px;
        }
        .btn {
            width: 100%;
            margin-top: 8px;
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            background: var(--accent-red);
            color: #fff;
            font-size: 1em;
            font-weight: 700;
            cursor: pointer;
        }
        .back-link {
            display: inline-block;
            margin-top: 18px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.92em;
        }
        .back-link:hover { color: #fff; }
        {{ global_theme_css|safe }}
    </style>
</head>
<body>
    <div class="panel">
        <h1>Choose a new password</h1>
        <p class="subtitle">Enter a new password for your account. This link can only be used once.</p>
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, msg in messages %}
            <div class="flash {{ category }}">{{ msg }}</div>
            {% endfor %}
        {% endif %}
        {% endwith %}
        <form method="POST" action="{{ url_for('reset_password', token=token) }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="new_password">New password</label>
                <input type="password" id="new_password" name="new_password" required minlength="6" autocomplete="new-password">
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm new password</label>
                <input type="password" id="confirm_password" name="confirm_password" required minlength="6" autocomplete="new-password">
            </div>
            <button type="submit" class="btn">Update password</button>
        </form>
        <a class="back-link" href="{{ url_for('login') }}">← Back to log in</a>
    </div>
    <script>
        document.querySelector('form').addEventListener('submit', function(e) {
            var a = document.getElementById('new_password').value;
            var b = document.getElementById('confirm_password').value;
            if (a !== b) {
                e.preventDefault();
                alert('Passwords do not match.');
            }
        });
    </script>
</body>
</html>
