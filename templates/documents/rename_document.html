<!DOCTYPE html>
<html>
<head>
    <title>Rename Document - Onboarding App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'URW Form', Arial, sans-serif; background: #f5f5f5; }
        .header {
            background: #000000;
            color: white;
            padding: 12px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 60px;
        }
        .header-content h1 { font-weight: 800; margin: 0; }
        .back-btn {
            background: rgba(255,255,255,0.2);
            color: #fff;
            padding: 8px 16px;
            border-radius: 0.5rem;
            text-decoration: none;
            border: 1px solid rgba(255,255,255,0.3);
        }
        .back-btn:hover { background: rgba(255,255,255,0.3); color: #fff; }
        .container { max-width: 600px; margin: 30px auto; padding: 0 20px; }
        .panel {
            background: white;
            padding: 25px;
            border-radius: 0.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .panel h2 { margin-bottom: 20px; color: #000; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; }
        .form-group input[type="text"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 0.5rem;
            font-size: 1em;
        }
        .form-group small { color: #666; font-size: 0.9em; display: block; margin-top: 6px; }
        .btn {
            display: inline-block;
            padding: 10px 24px;
            background: #FE0100;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
        }
        .btn:hover { background: #c00; color: white; }
        .btn-secondary { background: #6c757d; }
        .btn-secondary:hover { background: #5a6268; color: white; }
        .file-name { color: #666; font-size: 0.9em; margin-top: 8px; }
    {{ global_theme_css|safe }}
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content"><h1>✏️ Rename Document</h1></div>
        <div class="header-actions"><a href="{{ url_for('manage_documents') }}" class="back-btn">← Back to Documents</a></div>
    </div>
    <div class="container">
        <div class="panel">
            <h2>Name visible to users</h2>
            <p class="file-name">File: {{ document.original_filename }}</p>
            <form method="POST" action="{{ url_for('rename_document', doc_id=document.id) }}">
                <div class="form-group">
                    <label for="display_name">Display name</label>
                    <input type="text" name="display_name" id="display_name" value="{{ current_name }}" maxlength="255" placeholder="e.g. Employee Handbook">
                    <small>This is the title users see. Leave blank (or match the file name) to use the file name.</small>
                </div>
                <div class="form-group">
                    <label for="store_id">Library available at</label>
                    <select name="store_id" id="store_id" style="width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 0.5rem;">
                        <option value="" {% if not document.store_id %}selected{% endif %}>All stores</option>
                        {% for store in stores %}
                        <option value="{{ store.id }}" {% if document.store_id == store.id %}selected{% endif %}>{{ store.name }} ({{ store.code }})</option>
                        {% endfor %}
                    </select>
                    <small>Store scope for the optional library only. Use Assign to Users for required signing.</small>
                </div>
                <button type="submit" class="btn">Save</button>
                <a href="{{ url_for('manage_documents') }}" class="btn btn-secondary" style="margin-left: 10px; text-decoration: none;">Cancel</a>
            </form>
        </div>
    </div>
</body>
</html>
